android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g
# Versi default (dipakai build non-tag); build tag vX.Y.Z menimpa lewat -PappVersionName / -PappVersionCode
appVersionName=1.8
appVersionCode=10800
# Repo GitHub untuk fitur update di dalam aplikasi (build CI menimpa dengan -PgithubRepo=$GITHUB_REPOSITORY)
githubRepo=udyneos/resteam
